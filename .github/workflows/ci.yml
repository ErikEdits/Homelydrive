# Checks every push and pull request: web interface, Go tests, builds for
# Linux and Windows, the server tests on Windows, and the Android app.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Server, PC-App, Weboberfläche
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: System packages (FUSE for the virtual drive)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfuse-dev
      - name: Web interface
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: Build Linux
        run: SKIP_WEB=1 scripts/build.sh
      - name: Build Windows
        run: GOOS=windows GOARCH=amd64 SKIP_WEB=1 scripts/build.sh

  windows:
    name: Server unter Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./internal/server/...
      - name: go test
        run: go test ./internal/server/...

  android:
    name: Android-App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Lint
        working-directory: android
        run: ./gradlew --no-daemon lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
