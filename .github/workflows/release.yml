# Builds all downloads and publishes them as a GitHub release when
#   - a version tag is pushed (git tag v1.2.3 && git push origin v1.2.3), or
#   - a commit changes the VERSION file and has "[release]" in its message
#     (the tag is then created by this workflow).
# Other pushes that touch the packaging only make a test build.
#
#   Windows: setup .exe for server and PC app (+ portable zip)
#   Linux:   .deb, AppImage, tar.gz
#   Android: .apk
#   Docker:  ghcr.io/erikedits/homelydrive
name: Release

on:
  push:
    tags: ["v*"]
    # Test build (nothing is published) when the packaging changes.
    branches: ["**"]
    paths:
      - "packaging/**"
      - "scripts/**"
      - "android/**/*.gradle.kts"
      - "VERSION"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a test build without release (e.g. v0.0.0-test)"
        required: true
        default: v0.0.0-test

permissions:
  contents: write
  packages: write

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          INPUT: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"; publish=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$MESSAGE" == *"[release]"* ]]; then
            version="v$(tr -d ' \n\r' < VERSION)"; publish=true
          else
            version="${INPUT:-v0.0.0-dev}"; publish=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version $version (publish: $publish)"

  linux:
    name: Linux (.deb, AppImage)
    needs: meta
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfuse-dev libfuse2
      - name: Build
        run: scripts/build.sh "$VERSION"
      - name: Packages
        run: |
          V="${VERSION#v}"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          for p in server client; do
            VERSION="$V" "$RUNNER_TEMP/bin/nfpm" package -f "packaging/linux/nfpm-$p.yaml" -p deb -t dist/
          done
          packaging/appimage/build-appimage.sh "$VERSION"
          tar -C dist/linux-amd64 -czf "dist/homelydrive-$V-linux-amd64.tar.gz" homelydrive homelydrive-server
          rm -f dist/appimagetool-*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz

  windows:
    name: Windows (Setup .exe)
    needs: meta
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: GOOS=windows GOARCH=amd64 scripts/build.sh "$VERSION"
      - name: Download WinFsp (virtual drive)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo winfsp/winfsp --pattern "winfsp-*.msi" --output dist/winfsp.msi
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $v = $env:VERSION -replace '^v', ''
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$v" packaging\windows\server.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $iscc "/DAppVersion=$v" packaging\windows\client.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist\windows-amd64\homelydrive.exe, dist\windows-amd64\homelydrive-server.exe -DestinationPath "dist\homelydrive-$v-windows-amd64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*Setup*.exe
            dist/*.zip

  android:
    name: Android (.apk)
    needs: meta
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key (optional, see docs/releases.md)
        env:
          KEYSTORE: ${{ secrets.HD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "HD_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No HD_KEYSTORE_BASE64 secret - the APK is signed with a temporary debug key (updates will not install over it)."
          fi
      - name: Build
        working-directory: android
        env:
          HD_VERSION: ${{ needs.meta.outputs.version }}
          HD_KEYSTORE_PASSWORD: ${{ secrets.HD_KEYSTORE_PASSWORD }}
          HD_KEY_ALIAS: ${{ secrets.HD_KEY_ALIAS }}
          HD_KEY_PASSWORD: ${{ secrets.HD_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/Homelydrive-${VERSION#v}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  docker:
    name: Docker (ghcr.io)
    needs: meta
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/erikedits/homelydrive
          tags: |
            type=semver,pattern={{version}},value=${{ needs.meta.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: GitHub Release
    needs: [meta, linux, windows, android]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes
        run: sed "s|{{TAG}}|${VERSION}|g" docs/release-notes.md > "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Homelydrive ${{ needs.meta.outputs.version }}
          files: dist/*
          generate_release_notes: true
          body_path: ${{ runner.temp }}/notes.md
